<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Hành Vi Học Tập AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; background-color: #f4f6f9; }
        .sidebar { width: 250px; background-color: #1e293b; color: white; height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h3 { text-align: center; margin-bottom: 30px; color: #38bdf8; }
        .menu-btn { width: 100%; padding: 12px; background: none; border: none; color: #cbd5e1; text-align: left; font-size: 16px; cursor: pointer; border-radius: 6px; margin-bottom: 10px; }
        .menu-btn:hover, .menu-btn.active { background-color: #334155; color: white; }
        .main-content { flex: 1; padding: 30px; box-sizing: border-box; }
        .chat-box { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 70vh; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; border-bottom: 1px solid #e2e8f0; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 8px; max-width: 70%; line-height: 1.5; }
        .user-msg { background-color: #0ea5e9; color: white; align-self: flex-end; margin-left: auto; }
        .ai-msg { background-color: #f1f5f9; color: #1e293b; align-self: flex-start; }
        .chat-input-area { padding: 15px; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .chat-input-area button { padding: 12px 24px; background-color: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background-color: #0284c7; }
    </style>
</head>
<body>

    <!-- Thanh Menu Bên Trái (Bước 2) -->
    <div class="sidebar">
        <h3>HỆ THỐNG KHKT</h3>
        <button class="menu-btn active">💬 Chat với AI</button>
        <button class="menu-btn">📚 Học với Notebook</button>
        <button class="menu-btn">📄 Upload PDF</button>
        <button class="menu-btn">📊 Phân tích hành vi</button>
        <button class="menu-btn">👤 Hồ sơ</button>
    </div>

    <!-- Vùng Nội Dung Chính: Giao diện Chat AI (Bước 3) -->
    <div class="main-content">
        <h2 id="welcome-text">Xin chào học sinh!</h2>
        <div class="chat-box">
            <div class="chat-messages" id="chat-messages">
                <div class="message ai-msg">Xin chào! Mình có thể giúp gì cho bạn trong buổi học hôm nay?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Nhập câu hỏi học tập tại đây... (Ví dụ: Giải thích định luật Ôm)">
                <button onclick="guiCauHoiAI()">Gửi đi</button>
            </div>
        </div>
    </div>

    <!-- Dùng chung file index.js cũ để xử lý logic chat -->
    <script src="index.js"></script>
    <script>
        // Khi trang web tải xong, tự động đọc tên học sinh để hiển thị lời chào
        async function taiThongTin() {
            try {
                const res = await fetch('/api/student-info');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('welcome-text').innerText = `Xin chào học sinh: ${data.ho_ten} (${data.lop} - ${data.truong})`;
                }
            } catch (e) { console.log(e); }
        }
        taiThongTin();
    </script>
</body>
</html>
